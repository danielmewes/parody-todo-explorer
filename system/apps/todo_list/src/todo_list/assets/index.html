<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Tasks - Web Browser</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<!-- Chunky period-correct iconography. Colour is deliberate: late-nineties
     toolbars used 20x20 colour bitmaps, not monochrome line art. -->
<svg class="sprite" aria-hidden="true" focusable="false"><defs>
  <symbol id="ic-back" viewBox="0 0 20 20"><path d="M11 4 4 10l7 6z" fill="#1c5e1c"/><path d="M10 8h6v4h-6z" fill="#2f9e2f"/></symbol>
  <symbol id="ic-forward" viewBox="0 0 20 20"><path d="M9 4l7 6-7 6z" fill="#1c5e1c"/><path d="M4 8h6v4H4z" fill="#2f9e2f"/></symbol>
  <symbol id="ic-stop" viewBox="0 0 20 20"><path d="M7 3h6l4 4v6l-4 4H7l-4-4V7z" fill="#c02020"/><path d="M6.5 6.5l7 7M13.5 6.5l-7 7" stroke="#fff" stroke-width="2"/></symbol>
  <symbol id="ic-refresh" viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-2.2-4.6" fill="none" stroke="#1a6ec0" stroke-width="2.6"/><path d="M17 2v5h-5z" fill="#1a6ec0"/></symbol>
  <symbol id="ic-home" viewBox="0 0 20 20"><path d="M10 3l7 6h-2v8H5V9H3z" fill="#c8a020"/><path d="M8 11h4v6H8z" fill="#6b4b10"/></symbol>
  <symbol id="ic-search" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5" fill="#cfe4f7" stroke="#1a4e8a" stroke-width="2"/><path d="M12.5 12.5l5 5" stroke="#404040" stroke-width="3"/></symbol>
  <symbol id="ic-fav" viewBox="0 0 20 20"><path d="M10 2.5l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4L2.2 8.2l5.4-.8z" fill="#f2c200" stroke="#8a6b00" stroke-width="1.2"/></symbol>
  <symbol id="ic-history" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="#e2e8f5" stroke="#2c4a8a" stroke-width="2"/><path d="M10 5.5V10l3.5 2.2" stroke="#2c4a8a" stroke-width="2" fill="none"/></symbol>
  <symbol id="ic-mail" viewBox="0 0 20 20"><path d="M2 5h16v10H2z" fill="#fff" stroke="#444" stroke-width="1.5"/><path d="M2.5 5.5L10 11l7.5-5.5" fill="none" stroke="#b03030" stroke-width="1.8"/></symbol>
  <symbol id="ic-print" viewBox="0 0 20 20"><path d="M6 3h8v4H6z" fill="#fff" stroke="#444" stroke-width="1.4"/><path d="M3 8h14v6H3z" fill="#9aa3b0" stroke="#444" stroke-width="1.4"/><path d="M6 12h8v5H6z" fill="#fff" stroke="#444" stroke-width="1.4"/></symbol>
  <symbol id="ic-edit" viewBox="0 0 20 20"><path d="M3 14l1-4 8-8 3 3-8 8z" fill="#f0c674" stroke="#6b5010" stroke-width="1.3"/><path d="M3 17h14" stroke="#444" stroke-width="1.6"/></symbol>
  <symbol id="ic-note" viewBox="0 0 20 20"><path d="M3 3h14v10H9l-4 4v-4H3z" fill="#fff8c0" stroke="#7a6b10" stroke-width="1.4"/><path d="M6 6h8M6 9h6" stroke="#7a6b10" stroke-width="1.3"/></symbol>
  <symbol id="ic-research" viewBox="0 0 20 20"><path d="M3 4h6l1 2h7v10H3z" fill="#d8c070" stroke="#6b5010" stroke-width="1.3"/><circle cx="12" cy="11" r="3" fill="#fff" stroke="#1a4e8a" stroke-width="1.6"/></symbol>
  <symbol id="ic-folder" viewBox="0 0 16 16"><path d="M1 3h5l1 2h8v8H1z" fill="#f0c674" stroke="#6b5010" stroke-width="1.2"/></symbol>
  <symbol id="ic-page" viewBox="0 0 16 16"><path d="M3 1h7l3 3v11H3z" fill="#fff" stroke="#555" stroke-width="1.2"/><path d="M10 1v3h3" fill="none" stroke="#555" stroke-width="1.2"/></symbol>
  <symbol id="ic-globe" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="#bcd8f0" stroke="#1a4e8a" stroke-width="1.3"/><path d="M2 8h12M8 2c2.5 3 2.5 9 0 12M8 2c-2.5 3-2.5 9 0 12" fill="none" stroke="#1a4e8a" stroke-width="1.1"/></symbol>
  <symbol id="ic-lock" viewBox="0 0 16 16"><path d="M4 7h8v6H4z" fill="#e8c840" stroke="#6b5010" stroke-width="1.1"/><path d="M6 7V5a2 2 0 0 1 4 0v2" fill="none" stroke="#6b5010" stroke-width="1.4"/></symbol>
  <symbol id="ic-modem" viewBox="0 0 16 16"><path d="M1 5h6v6H1zM9 5h6v6H9z" fill="#cfd8e8" stroke="#43506b" stroke-width="1.1"/><path d="M3 8h2M11 8h2" stroke="#2f7f2f" stroke-width="1.6"/></symbol>
  <symbol id="ic-clip" viewBox="0 0 24 40"><path d="M7 30V11a5 5 0 0 1 10 0v20a3 3 0 0 1-6 0V13" fill="none" stroke="#8f9bb3" stroke-width="3.2" stroke-linecap="round"/><g class="eye"><ellipse cx="9.4" cy="9" rx="2.3" ry="2.6" fill="#fff" stroke="#5c6880" stroke-width=".8"/><ellipse cx="14.6" cy="9" rx="2.3" ry="2.6" fill="#fff" stroke="#5c6880" stroke-width=".8"/><circle cx="10" cy="9.4" r="1.05" fill="#16202e"/><circle cx="15.2" cy="9.4" r="1.05" fill="#16202e"/></g></symbol>
  <symbol id="ic-trash" viewBox="0 0 16 16"><path d="M3 4h10l-1 10H4z" fill="#b8c0cc" stroke="#444" stroke-width="1.2"/><path d="M2 3h12M6 2h4" stroke="#444" stroke-width="1.3"/></symbol>
  <symbol id="ic-bolt" viewBox="0 0 16 16"><path d="M9 1L3 9h4l-1 6 7-9H9z" fill="#f2c200" stroke="#7a5f00" stroke-width="1"/></symbol>
  <symbol id="ic-cart" viewBox="0 0 16 16"><path d="M1 2h2l2 8h8" fill="none" stroke="#1a5e1a" stroke-width="1.6"/><path d="M4 4h11l-1.5 5H5z" fill="#8fd08f" stroke="#1a5e1a" stroke-width="1.2"/><circle cx="6" cy="13" r="1.4" fill="#1a5e1a"/><circle cx="12" cy="13" r="1.4" fill="#1a5e1a"/></symbol>
</defs></svg>

<div id="desktop">
<div id="browser-window">

  <!-- ---------- Title bar ---------- -->
  <div class="titlebar" id="titlebar">
    <svg class="ic16 title-ic"><use href="#ic-globe"/></svg>
    <span class="title-text" id="window-title">My Tasks - Web Browser</span>
    <div class="title-buttons">
      <button class="tbtn" id="btn-minimize" title="Collapse the list to a one-line summary">_</button>
      <button class="tbtn" id="btn-maximize" title="Switch between the wide and narrow reading column">&#9633;</button>
      <button class="tbtn tbtn-close" id="btn-close" title="Finish for the day">&#10005;</button>
    </div>
  </div>

  <!-- ---------- Menu bar ---------- -->
  <div class="menubar-row">
    <div class="menubar" id="menubar" role="menubar"></div>
    <button id="throbber" title="Back to the whole list">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10" fill="#1a4e8a"/>
        <ellipse class="ring" cx="12" cy="12" rx="10" ry="4" fill="none" stroke="#ffd166" stroke-width="2.4"/>
        <ellipse class="ring2" cx="12" cy="12" rx="4" ry="10" fill="none" stroke="#8fd0ff" stroke-width="1.4"/>
      </svg>
    </button>
  </div>

  <!-- ---------- Toolbars ---------- -->
  <div id="toolbars">

    <div class="tb" data-tb="standard">
      <span class="grip"></span>
      <div class="tb-body" id="tb-standard"></div>
    </div>

    <div class="tb" data-tb="address">
      <span class="grip"></span>
      <label class="tb-label" for="address">Address</label>
      <div class="combo">
        <input id="address" class="sunken addr-input" type="text" spellcheck="false" autocomplete="off" aria-label="Address">
        <button class="combo-arrow" id="address-drop" title="Show the lists you have open">&#9660;</button>
      </div>
      <button class="tb-btn tb-btn-text" id="btn-go"><svg class="ic16"><use href="#ic-forward"/></svg>Go</button>
      <span class="tb-sep"></span>
      <button class="tb-btn tb-btn-text" id="btn-newlist" title="Start a separate list">New list</button>
    </div>

    <div class="tb" data-tb="links">
      <span class="grip"></span>
      <span class="tb-label">Links</span>
      <div class="tb-body" id="tb-links"></div>
    </div>

    <!-- ---- Installed extensions ---- -->

    <div class="tb ad-tb tb-taskfinder" data-tb="taskfinder">
      <span class="grip"></span>
      <span class="ad-brand">TaskFinder<sup>&#174;</sup></span>
      <input id="tf-query" class="sunken ad-input" type="text" placeholder="Search my tasks" aria-label="Search tasks">
      <button class="ad-btn" id="tf-search"><svg class="ic16"><use href="#ic-search"/></svg>Search</button>
      <button class="ad-btn toggle" id="tf-highlight" title="Paint a yellow marker over every match">Highlight</button>
      <button class="ad-btn" id="tf-autofill" title="Reuse a phrase you have written before">AutoFill</button>
      <button class="ad-btn" id="tf-blocked" title="Pop-ups stopped so far"><svg class="ic16"><use href="#ic-stop"/></svg>Blocked: <b id="tf-blocked-n">0</b></button>
      <button class="ad-btn" id="tf-settings">Settings</button>
    </div>

    <div class="tb ad-tb tb-finditall" data-tb="finditall">
      <span class="grip"></span>
      <span class="ad-brand">FindItAll Search Suite</span>
      <select id="fa-scope" class="sunken ad-input" aria-label="Where to search">
        <option value="current">This list</option>
        <option value="all">Every list</option>
        <option value="notes">Notes only</option>
        <option value="deleted">Deleted tasks</option>
      </select>
      <input id="fa-query" class="sunken ad-input" type="text" placeholder="Find anything" aria-label="Search everything">
      <button class="ad-btn" id="fa-go"><svg class="ic16"><use href="#ic-search"/></svg>Find it all</button>
      <button class="ad-btn" id="fa-lucky">Take me to the oldest one</button>
      <button class="ad-btn" id="fa-web">Search the web</button>
    </div>

    <div class="tb ad-tb tb-genie" data-tb="choregenie">
      <span class="grip"></span>
      <span class="ad-brand genie-brand">Chore Genie!</span>
      <button class="ad-btn" id="cg-templates"><svg class="ic16"><use href="#ic-folder"/></svg>Task templates &#9660;</button>
      <button class="ad-btn" id="cg-random"><svg class="ic16"><use href="#ic-bolt"/></svg>Surprise me</button>
      <button class="ad-btn" id="cg-streak" title="How many days running you have finished something">Streak: <b id="cg-streak-n">0</b></button>
      <span class="genie-says">Genie says: <span id="cg-tip">loading...</span></span>
    </div>

    <div class="tb ad-tb tb-deadline" data-tb="deadlinebar">
      <span class="grip"></span>
      <span class="ad-brand">DeadlineBar Pro</span>
      <button class="ad-btn" data-due="today">Due today</button>
      <button class="ad-btn" data-due="tomorrow">Tomorrow</button>
      <button class="ad-btn" data-due="weekend">This weekend</button>
      <button class="ad-btn" data-due="nextweek">Next week</button>
      <input id="dl-date" class="sunken ad-input ad-date" type="date" aria-label="Pick a due date">
      <button class="ad-btn" id="dl-set">Set date</button>
      <button class="ad-btn" id="dl-clear">No date</button>
      <button class="ad-btn alarm" id="dl-overdue">Overdue: <b id="dl-overdue-n">0</b></button>
    </div>

    <div class="tb ad-tb tb-priority" data-tb="prioritypal">
      <span class="grip"></span>
      <span class="ad-brand">PriorityPal 2000</span>
      <button class="ad-btn pri pri1" data-pri="1">! Low</button>
      <button class="ad-btn pri pri2" data-pri="2">!! Normal</button>
      <button class="ad-btn pri pri3" data-pri="3">!!! Urgent</button>
      <button class="ad-btn" data-pri="0">No marker</button>
      <button class="ad-btn" id="pp-sort">Sort by urgency</button>
      <button class="ad-btn panic" id="pp-panic">PANIC MODE</button>
    </div>

    <div class="tb ad-tb tb-weather" data-tb="weathertask">
      <span class="grip"></span>
      <span class="ad-brand">WeatherTask 2000</span>
      <span class="wx" id="wx-readout">--</span>
      <button class="ad-btn" id="wx-outdoor">Add an outdoor job</button>
      <button class="ad-btn" id="wx-indoor">Add an indoor job</button>
      <button class="ad-btn" id="wx-umbrella">Umbrella check</button>
      <button class="ad-btn" id="wx-forecast">5-day plan</button>
    </div>

    <div class="tb ad-tb tb-shop" data-tb="shopsmart">
      <span class="grip"></span>
      <span class="ad-brand shop-brand">ShopSmart$aver</span>
      <input id="ss-item" class="sunken ad-input" type="text" placeholder="Milk, bin bags, stamps..." aria-label="Shopping item">
      <button class="ad-btn" id="ss-add"><svg class="ic16"><use href="#ic-cart"/></svg>Add to shopping</button>
      <button class="ad-btn" id="ss-show">Show shopping list</button>
      <button class="ad-btn blink" id="ss-coupons">Money-saving jobs!</button>
    </div>

  </div><!-- /#toolbars -->

  <!-- ---------- Find bar ---------- -->
  <div id="findbar" hidden>
    <span class="tb-label">Find</span>
    <input id="find-input" class="sunken" type="text" aria-label="Find in tasks">
    <button class="btn" id="find-next">Find next</button>
    <button class="btn" id="find-close">Close</button>
    <span id="find-count" class="dim"></span>
  </div>

  <!-- ---------- Page ---------- -->
  <div id="page">

    <div id="explorer-bar">
      <div class="xbar-head">
        <span id="xbar-title">Task Assistant</span>
        <button class="xbar-close" id="xbar-close" title="Close this panel">&#10005;</button>
      </div>
      <div class="xbar-body" id="xbar-body"></div>
    </div>

    <div id="doc">
      <div id="banner-ad" class="ad-slot">
        <div class="banner-inner">
          <span class="banner-star">&#9733;</span>
          <span class="banner-copy" id="banner-copy"></span>
          <button class="banner-cta" id="banner-cta">Sort it out</button>
          <button class="ad-x" data-close-ad="banner-ad" title="Hide this banner">&#10005;</button>
        </div>
      </div>

      <div id="doc-main">
        <div id="content">
          <div id="page-head">
            <h1 id="list-heading">My Tasks</h1>
            <p id="tally"></p>
          </div>

          <form id="add-form" autocomplete="off">
            <input id="new-task" type="text" class="sunken" placeholder="Type a task, then press Add" aria-label="New task">
            <button class="btn btn-default" type="submit">Add</button>
            <button class="btn" type="button" id="btn-add-detail" title="Set a date, an urgency marker and a note before adding">Add with details...</button>
          </form>

          <div id="filter-strip" hidden>
            <span id="filter-label"></span>
            <button class="btn btn-small" id="filter-clear">Show everything</button>
          </div>

          <ul id="list"></ul>
          <div id="empty" hidden></div>

          <div id="doc-foot">
            <span class="dim" id="saved-note"></span>
            <button class="btn btn-small" id="btn-view-source" title="See exactly what is stored in this browser">View stored data</button>
          </div>
        </div>

        <div id="skyscraper" class="ad-slot">
          <button class="ad-x" data-close-ad="skyscraper" title="Hide this panel">&#10005;</button>
          <div class="sky-inner" id="sky-inner"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ---------- Status bar ---------- -->
  <div id="statusbar">
    <div class="sb-cell sb-grow" id="sb-message">Done</div>
    <div class="sb-cell sb-progress"><div id="sb-bar"></div></div>
    <div class="sb-cell" id="sb-count">0 items</div>
    <div class="sb-cell" id="sb-conn"><svg class="ic16"><use href="#ic-modem"/></svg><span id="sb-conn-text">Connected at 56.6 Kbps</span></div>
    <div class="sb-cell" id="sb-zone"><svg class="ic16"><use href="#ic-lock"/></svg>My Computer</div>
    <div class="sb-cell sb-tray" id="sb-tray"></div>
  </div>

</div><!-- /#browser-window -->
</div><!-- /#desktop -->

<div id="menu-layer"></div>
<div id="popup-layer"></div>
<div id="dialog-layer"></div>
<div id="focus-mode" hidden><div id="focus-card"></div><button class="btn" id="focus-exit">Back to the list</button></div>

<script src="/static/app.js"></script>
</body>
</html>
