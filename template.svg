<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A chunky grey window with a blue gradient title bar, four clashing toolbar strips and three to-do rows">
  <!-- A miniature of the app itself: the window, the stack of garish add-on
       toolbars, and the list underneath. Mock tasks only. -->
  <defs>
    <linearGradient id="caption" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000080"/>
      <stop offset="1" stop-color="#1084d0"/>
    </linearGradient>
    <linearGradient id="tbYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#f7c948"/>
    </linearGradient>
    <linearGradient id="tbPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6d8ff"/>
      <stop offset="1" stop-color="#c6a8f0"/>
    </linearGradient>
    <linearGradient id="tbGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddf5dd"/>
      <stop offset="1" stop-color="#9fd89f"/>
    </linearGradient>
    <linearGradient id="tbRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdede"/>
      <stop offset="1" stop-color="#f3a8a8"/>
    </linearGradient>
  </defs>

  <!-- the desktop behind it -->
  <rect width="240" height="160" fill="#3a6ea5"/>

  <!-- the window, bevelled the period way: white top-left, black bottom-right -->
  <rect x="9" y="7" width="222" height="146" fill="#000000"/>
  <rect x="9" y="7" width="221" height="145" fill="#ffffff"/>
  <rect x="10" y="8" width="219" height="143" fill="#808080"/>
  <rect x="10" y="8" width="218" height="142" fill="#d4d0c8"/>

  <!-- title bar -->
  <rect x="12" y="10" width="214" height="15" fill="url(#caption)"/>
  <circle cx="20" cy="17.5" r="4.5" fill="#bcd8f0" stroke="#0b3a6b" stroke-width="1"/>
  <path d="M15.5 17.5h9M20 13c1.9 2.4 1.9 6.6 0 9M20 13c-1.9 2.4-1.9 6.6 0 9" fill="none" stroke="#0b3a6b" stroke-width="0.7"/>
  <text x="29" y="21" font-family="Verdana, Geneva, sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff">My Tasks</text>
  <g fill="#d4d0c8" stroke="#000000" stroke-width="0.8">
    <rect x="182" y="12" width="13" height="11"/>
    <rect x="196" y="12" width="13" height="11"/>
    <rect x="210" y="12" width="13" height="11"/>
  </g>
  <path d="M185 20h7M199.5 15h6v6h-6zM213.5 15.5l6 6M219.5 15.5l-6 6" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- menu bar: File Edit View Favourites Tools Help, as ticks -->
  <g fill="#3c3c3c">
    <rect x="14" y="29" width="11" height="3"/>
    <rect x="29" y="29" width="12" height="3"/>
    <rect x="45" y="29" width="13" height="3"/>
    <rect x="62" y="29" width="22" height="3"/>
    <rect x="88" y="29" width="14" height="3"/>
    <rect x="106" y="29" width="11" height="3"/>
  </g>

  <!-- standard buttons toolbar -->
  <rect x="12" y="36" width="214" height="14" fill="#d4d0c8"/>
  <rect x="12" y="49.5" width="214" height="0.8" fill="#808080"/>
  <g stroke="#3c3c3c" stroke-width="0.6">
    <rect x="16" y="39" width="9" height="9" fill="#2f9e2f"/>
    <rect x="28" y="39" width="9" height="9" fill="#1a6ec0"/>
    <rect x="40" y="39" width="9" height="9" fill="#c02020"/>
    <rect x="52" y="39" width="9" height="9" fill="#f2c200"/>
    <rect x="67" y="39" width="9" height="9" fill="#c8a020"/>
    <rect x="79" y="39" width="9" height="9" fill="#8fd08f"/>
  </g>

  <!-- the add-on toolbars nobody asked for -->
  <rect x="12" y="51" width="214" height="11" fill="url(#tbYellow)"/>
  <rect x="12" y="61.6" width="214" height="0.8" fill="#a8791a"/>
  <rect x="16" y="53.5" width="20" height="6" fill="#6b3b00"/>
  <rect x="39" y="53" width="58" height="7" fill="#ffffff" stroke="#8a6a00" stroke-width="0.7"/>
  <rect x="100" y="53" width="18" height="7" fill="#ffd166" stroke="#8a6a00" stroke-width="0.7"/>

  <rect x="12" y="62" width="214" height="11" fill="url(#tbPurple)"/>
  <rect x="12" y="72.6" width="214" height="0.8" fill="#6a3fa0"/>
  <rect x="16" y="64.5" width="26" height="6" fill="#4a1f80"/>
  <rect x="46" y="64" width="24" height="7" fill="#e6d8ff" stroke="#6a3fa0" stroke-width="0.7"/>
  <rect x="73" y="64" width="30" height="7" fill="#e6d8ff" stroke="#6a3fa0" stroke-width="0.7"/>

  <rect x="12" y="73" width="214" height="11" fill="url(#tbGreen)"/>
  <rect x="12" y="83.6" width="214" height="0.8" fill="#2f7f2f"/>
  <rect x="16" y="75.5" width="24" height="6" fill="#14561a"/>
  <rect x="44" y="75" width="16" height="7" fill="#ddf5dd" stroke="#2f7f2f" stroke-width="0.7"/>
  <rect x="63" y="75" width="22" height="7" fill="#ddf5dd" stroke="#2f7f2f" stroke-width="0.7"/>
  <rect x="88" y="75" width="18" height="7" fill="#ddf5dd" stroke="#2f7f2f" stroke-width="0.7"/>

  <rect x="12" y="84" width="214" height="11" fill="url(#tbRed)"/>
  <rect x="12" y="94.6" width="214" height="0.8" fill="#aa3333"/>
  <rect x="16" y="86.5" width="22" height="6" fill="#7a0000"/>
  <circle cx="45" cy="89.5" r="3" fill="#c02020" stroke="#7a0000" stroke-width="0.7"/>
  <circle cx="54" cy="89.5" r="3" fill="#f2c200" stroke="#7a0000" stroke-width="0.7"/>
  <circle cx="63" cy="89.5" r="3" fill="#8fd08f" stroke="#7a0000" stroke-width="0.7"/>

  <!-- the list itself, in a sunken white well -->
  <rect x="14" y="98" width="210" height="40" fill="#808080"/>
  <rect x="15" y="99" width="209" height="39" fill="#ffffff"/>

  <!-- task one: still to do -->
  <rect x="20" y="103" width="8" height="8" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="33" y="105" width="96" height="4" fill="#444444"/>
  <rect x="196" y="105" width="22" height="4" fill="#a33333"/>

  <!-- task two: ticked off, and struck through -->
  <rect x="20" y="115" width="8" height="8" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <path d="M21.5 119l2.5 2.5 4.5-5.5" fill="none" stroke="#1a6ec0" stroke-width="1.8"/>
  <rect x="33" y="117" width="72" height="4" fill="#a8a8a8"/>
  <rect x="33" y="118.6" width="72" height="0.9" fill="#606060"/>

  <!-- task three: still to do, with a date chip -->
  <rect x="20" y="127" width="8" height="8" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="33" y="129" width="118" height="4" fill="#444444"/>
  <rect x="196" y="129" width="22" height="4" fill="#2f7f2f"/>

  <!-- status bar -->
  <rect x="14" y="140" width="210" height="9" fill="#d4d0c8" stroke="#808080" stroke-width="0.8"/>
  <rect x="18" y="143" width="34" height="3" fill="#6b6b6b"/>
  <rect x="60" y="143" width="20" height="3" fill="#8a8a8a"/>
  <g stroke="#5c6880" stroke-width="0.6">
    <rect x="186" y="142" width="6" height="5" fill="#f7c948"/>
    <rect x="195" y="142" width="6" height="5" fill="#c6a8f0"/>
    <rect x="204" y="142" width="6" height="5" fill="#9fd89f"/>
    <rect x="213" y="142" width="6" height="5" fill="#f3a8a8"/>
  </g>
</svg>
